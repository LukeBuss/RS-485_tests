; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:NANO_master]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/cu.usbserial-1410
monitor_port = /dev/cu.usbserial-1410
monitor_speed = 9600
build_flags = 
    -D ROLE_MASTER
    -D TARGET_NANO
    -D SERIAL_SPEED=9600
build_src_filter =
    -<*>
    +<master/main.cpp>
lib_deps =
    paulstoffregen/AltSoftSerial

[env:NANO_slave1]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/cu.usbserial-1430
monitor_port = /dev/cu.usbserial-1430
monitor_speed = 9600
build_flags = 
    -D ROLE_SLAVE1
    -D TARGET_NANO
    -D SERIAL_SPEED=9600
build_src_filter =
    -<*>
    +<slave1/main.cpp>
lib_deps =
    paulstoffregen/AltSoftSerial

[env:XIAO_nRF52840_master]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble
framework = arduino
monitor_speed = 9600
build_flags =
    -D ROLE_MASTER
    -D TARGET_NRF52840
    -D SERIAL_SPEED=9600
build_src_filter =
    -<*>
    +<master/main.cpp>

[env:XIAO_nRF52840_slave1]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble
framework = arduino
monitor_speed = 9600
build_flags =
    -D ROLE_SLAVE1
    -D TARGET_NRF52840
    -D SERIAL_SPEED=9600
build_src_filter =
    -<*>
    +<slave1/main.cpp>

