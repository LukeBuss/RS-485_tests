; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:NANO_master]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/cu.usbserial-1410
monitor_port = /dev/cu.usbserial-1410
monitor_speed = 9600
build_flags = 
    -D ROLE_MASTER
    -D TARGET_NANO
    -D SERIAL_SPEED=9600

[env:NANO_slave1]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = /dev/cu.usbserial-1430
monitor_port = /dev/cu.usbserial-1430
monitor_speed = 9600
build_flags = 
    -D ROLE_SLAVE1
    -D TARGET_NANO
    -D SERIAL_SPEED=9600

;[env:nano_slave2]
;platform = atmelavr
;board = nanoatmega328
;framework = arduino
;upload_port = /dev/cu.usbmodem14201
;monitor_port = /dev/cu.usbmodem14201
;monitor_speed = 9600
;build_flags = -D ROLE_SLAVE2 -D TARGET_NANO

[env:ESP32_master]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-1410
monitor_port = /dev/cu.usbserial-1410
monitor_speed = 115200
build_flags =
    -D TARGET_ESP32
    -D ROLE_MASTER
    -D SERIAL_SPEED=115200

[env:ESP32_slave1]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-1430
monitor_port = /dev/cu.usbserial-1430
monitor_speed = 115200
build_flags = 
    -D TARGET_ESP32
    -D ROLE_SLAVE1
    -D SERIAL_SPEED=115200

