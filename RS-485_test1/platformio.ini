[env:XIAO_nRF52840_slave1]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
upload_port = /dev/cu.usbserial-1430
monitor_port = /dev/cu.usbserial-1430
monitor_speed = 115200
build_flags =
    -D TARGET_NRF52840
    -D ROLE_SLAVE1
    -D SERIAL_SPEED=9600
build_src_filter =
    -<*>
    +<slave1/main.cpp>
    +<src/slave1/Slave1Functions.h>
    +<include/*>
    +<lib/*>

